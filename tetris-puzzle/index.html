<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>俄罗斯方块拼图 | 经典益智游戏</title>
    <script src="libs/tailwind/tailwindcss.js"></script>
    <link href="libs/fontawesome/css/font-awesome.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tetris: {
                            l: '#FF9500', j: '#0055A4', s: '#00D26A', z: '#FF3B30', i: '#00D4FF', t: '#BF5AF2', o: '#FFD60A'
                        },
                        newtetris: {
                            y: '#FFD60A', g: '#00D26A', b: '#0055A4', r: '#FF3B30'
                        },
                        game: {
                            bg: '#0F0F1A', 
                            panel: 'rgba(30, 30, 50, 0.75)', 
                            grid: 'rgba(255, 255, 255, 0.06)', 
                            target: 'rgba(255, 255, 255, 0.04)', 
                            text: '#F2F2F7', 
                            accent: '#00D4FF', 
                            accent2: '#BF5AF2',
                            hint: '#30D158'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'tetris': '0 8px 16px rgba(0, 0, 0, 0.4), 0 2px 4px rgba(0, 0, 0, 0.2)',
                        'tetris-hover': '0 12px 24px rgba(0, 0, 0, 0.5), 0 4px 8px rgba(0, 0, 0, 0.3)',
                        'glow': '0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.2)',
                        'glow-purple': '0 0 20px rgba(191, 90, 242, 0.4), 0 0 40px rgba(191, 90, 242, 0.2)',
                        'success-pulse': '0 0 30px rgba(48, 209, 88, 0.6)',
                        'block-relief': 'inset 3px 3px 6px rgba(255, 255, 255, 0.35), inset -3px -3px 6px rgba(0, 0, 0, 0.45)'
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .grid-cell { @apply border border-game-grid; }
            .tetris-piece { @apply transition-all duration-150 cursor-move select-none; touch-action: none; }
            .tetris-block { @apply shadow-block-relief transition-all duration-150; }
            .btn-game { @apply bg-slate-700/80 hover:bg-slate-600 text-game-text py-2 px-4 rounded-full transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg flex items-center gap-2 backdrop-blur-sm border border-white/10; }
            .btn-primary { @apply bg-game-accent hover:bg-game-accent/80 text-gray-900 py-2 px-4 rounded-full transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-glow flex items-center gap-2 font-semibold; }
            .grid-container { @apply rounded-2xl shadow-2xl overflow-hidden relative backdrop-blur-md bg-game-panel border border-white/10; }
            .piece-container { @apply relative overflow-hidden; }
            .pulse-animation { animation: pulse 1.2s infinite; }
            .hint-pulse { animation: hintPulse 1.2s infinite; }
            .target-hint-pulse { animation: targetHintPulse 1.2s infinite; }
            .success-animation { animation: success 0.5s ease-in-out; }
            .tip-highlight { @apply text-game-accent font-semibold; }
            .sound-control { @apply flex items-center gap-2 ml-2; }
            .glass-panel { @apply backdrop-blur-xl bg-game-panel border border-white/10 rounded-2xl; }
            .glass-overlay { @apply backdrop-blur-lg bg-black/60; }
        }
    </style>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0F0F1A 0%, #1A1A2E 50%, #16213E 100%);
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(191, 90, 242, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(48, 209, 88, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .game-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .game-header {
            width: 100%;
            z-index: 50;
            margin-bottom: 12px;
        }

        .game-main-area {
            display: flex;
            width: 100%;
            flex: 1;
            gap: 12px;
            min-height: 0;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .game-main-area.portrait {
            flex-direction: column;
        }

        .pieces-container,
        .center-container,
        #pieces-grid,
        #target-grid,
        .grid-container {
            box-sizing: border-box;
        }

        .pieces-container {
            min-width: 0;
        }

        .center-container {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .portrait .pieces-container,
        .portrait .center-container {
            width: 100%;
            max-height: 45vh;
        }

        * {
            touch-action: manipulation;
        }

        .grid-container {
            max-width: 100%;
            max-height: 100%;
            background: rgba(30, 30, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hint-block {
            position: absolute;
            z-index: 10;
            border: 2px solid rgba(0, 212, 255, 0.8);
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            animation: hintGlow 1s ease-in-out infinite;
        }

        @keyframes hintGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
            50% { box-shadow: 0 0 25px rgba(0, 212, 255, 0.7); }
        }

        .fullscreen-active {
            background-color: #000;
        }

        .fullscreen-active .game-wrapper {
            padding: 0;
        }

        .fullscreen-btn {
            background: rgba(0, 212, 255, 0.2);
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(0, 212, 255, 0.4);
        }

        .target-block.hint {
            opacity: 0.85;
            border: 2px solid rgba(0, 212, 255, 0.8);
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.15), inset -2px -2px 4px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 212, 255, 0.3);
        }

        #target-grid {
            z-index: 1;
        }

        .target-block {
            z-index: 2;
        }

        .target-block.hint-active {
            z-index: 40;
        }

        .tetris-piece {
            z-index: 10;
        }

        .tetris-piece.z-20 {
            z-index: 20;
        }

        .tetris-piece.z-30 {
            z-index: 30;
        }

        #success-message,
        #tutorial-message {
            z-index: 100;
        }

        .tetris-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), transparent);
            border-radius: inherit;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.03);
                box-shadow: 0 0 25px rgba(0, 212, 255, 0.7);
            }
        }

        @keyframes hintPulse {
            0%, 100% {
                opacity: 0.7;
                box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            }
        }

        @keyframes targetHintPulse {
            0%, 100% {
                opacity: 0.8;
                box-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.9);
            }
        }

        @keyframes success {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }

        .custom-select {
            background-color: rgba(30, 30, 50, 0.8);
            color: #F2F2F7;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            padding: 6px 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .custom-select:hover {
            border-color: rgba(0, 212, 255, 0.6);
        }

        .custom-select option {
            background-color: #1A1A2E;
            color: #F2F2F7;
        }

        .custom-select:focus {
            outline: none;
            border-color: #00D4FF;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        #tutorial-message {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 150;
        }

        #tutorial-message.show {
            opacity: 1;
            pointer-events: all;
        }

        .tutorial-content {
            max-width: 600px;
            width: 100%;
            background: linear-gradient(145deg, rgba(30, 30, 50, 0.9), rgba(25, 25, 45, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(0, 212, 255, 0.15);
        }

        .tutorial-title {
            text-align: center;
            color: #00D4FF;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .tutorial-steps {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .tutorial-step {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .tutorial-step:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 212, 255, 0.2);
        }

        .step-number {
            background: #00D4FF;
            color: #0F0F1A;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        .step-content {
            flex: 1;
            line-height: 1.6;
        }

        .tutorial-buttons {
            display: flex;
            justify-content: center;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transition: background 0.3s ease;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00D4FF;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
            transition: transform 0.2s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #settings-message {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            z-index: 200;
        }

        #settings-message.show {
            opacity: 1;
            pointer-events: all;
        }

        .settings-content {
            max-width: 400px;
            width: 100%;
            background: linear-gradient(145deg, rgba(30, 30, 50, 0.9), rgba(25, 25, 45, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(191, 90, 242, 0.15);
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .settings-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: rgba(242, 242, 247, 0.8);
            font-weight: 500;
        }

        .settings-value {
            font-size: 1rem;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .settings-title {
            text-align: center;
            color: #00D4FF;
            margin-bottom: 24px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .game-main-area {
                gap: min(1.5vw, 10px);
            }

            .btn-game {
                padding: 5px 10px;
                font-size: 12px;
            }

            .tutorial-content,
            .settings-content {
                padding: 24px;
                margin: 16px;
            }
        }
    </style>

    <link href="libs/fonts/inter.css" rel="stylesheet">
</head>

<body class="bg-game-bg text-game-text font-sans">
    <div id="tutorial-message">
        <div class="tutorial-content">
            <h2 class="tutorial-title">🎮 游戏操作指南</h2>
            <div class="tutorial-steps">
                <div class="tutorial-step">
                    <div class="step-number">1</div>
                    <div class="step-content">
                        <p><span class="tip-highlight">拖动彩色方块</span>到目标区域</p>
                    </div>
                </div>
                <div class="tutorial-step">
                    <div class="step-number">2</div>
                    <div class="step-content">
                        <p><span class="tip-highlight">双击彩色方块</span>可以旋转方块</p>
                    </div>
                </div>
                <div class="tutorial-step">
                    <div class="step-number">3</div>
                    <div class="step-content">
                        <p>将所有方块正确放入目标区域，<span class="tip-highlight">填满灰色图形</span>即可过关</p>
                    </div>
                </div>
                <div class="tutorial-step">
                    <div class="step-number">4</div>
                    <div class="step-content">

                    <div class="settings-value">
                        <span id="level-display" class="font-bold text-game-accent">1</span> / <span id="total-levels" class="font-medium">30</span>

                    <div class="flex items-center gap-2 flex-shrink-0">
                        <h1 class="text-[clamp(0.8rem,3vw,1.5rem)] font-bold tracking-tight whitespace-nowrap text-game-accent">方块拼图</h1>
                    </div>

                            <i class="fa fa-refresh"></i>

    <script>
        // 音效管理器 - 创建轻松明快的音效
        class SoundManager {
            constructor() {
                this.audioContext = null;
                this.volume = 0.3; // 默认音量适中
                this.isMuted = false;

                // 尝试初始化音频上下文
                this.initAudioContext();

                // 绑定事件监听
                document.getElementById('volume-slider').addEventListener('input', (e) => {
                    this.setVolume(e.target.value / 100);
                });

                // 音量图标点击切换静音
                document.getElementById('volume-icon').addEventListener('click', () => {
                    this.toggleMute();
                });
            }

            // 初始化音频上下文
            initAudioContext() {
                try {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioContext = new AudioContext();
                } catch (e) {
                    console.warn('Web Audio API 不受支持，音效将无法播放');
                }
            }

            // 设置音量
            setVolume(value) {
                this.volume = Math.max(0, Math.min(1, value));

                // 更新音量图标
                const icon = document.getElementById('volume-icon');
                if (this.volume === 0 || this.isMuted) {
                    icon.className = 'fa fa-volume-off text-game-accent text-sm';
                } else if (this.volume < 0.5) {
                    icon.className = 'fa fa-volume-down text-game-accent text-sm';
                } else {
                    icon.className = 'fa fa-volume-up text-game-accent text-sm';
                }

                // 更新滑块值
                document.getElementById('volume-slider').value = this.volume * 100;
            }

            // 切换静音状态
            toggleMute() {
                this.isMuted = !this.isMuted;
                this.setVolume(this.volume); // 更新图标
            }

            // 播放方块放置音效 - 清脆的短音
            playPlaceSound() {
                this.playTone({
                    frequency: 660, // A5音调，清脆明亮
                    type: 'sine',
                    duration: 0.1,
                    attack: 0.01,
                    release: 0.05,
                    volume: 0.7
                });
            }

            // 播放旋转音效 - 稍高的音调
            playRotateSound() {
                this.playTone({
                    frequency: 880, // A6音调，比放置音高
                    type: 'sine',
                    duration: 0.08,
                    attack: 0.005,
                    release: 0.03,
                    volume: 0.6
                });
            }

            // 播放提示音效 - 柔和的提示音
            playHintSound() {
                this.playTone({
                    frequency: 523.25, // C5音调，明亮但不刺耳
                    type: 'triangle',
                    duration: 0.2,
                    attack: 0.05,
                    release: 0.1,
                    volume: 0.5
                });
            }

            // 播放成功音效 - 愉快的和弦
            playSuccessSound() {
                // 和弦由三个音符组成
                this.playTone({
                    frequency: 659.25, // E5
                    type: 'sine',
                    duration: 0.3,
                    attack: 0.05,
                    release: 0.15,
                    volume: 0.7
                });

                setTimeout(() => {
                    this.playTone({
                        frequency: 783.99, // G5
                        type: 'sine',
                        duration: 0.3,
                        attack: 0.05,
                        release: 0.15,
                        volume: 0.7
                    });
                }, 100);

                setTimeout(() => {
                    this.playTone({
                        frequency: 1046.5, // C6
                        type: 'sine',
                        duration: 0.5,
                        attack: 0.05,
                        release: 0.3,
                        volume: 0.8
                    });
                }, 200);
            }

            // 播放重置音效 - 简短的下行音
            playResetSound() {
                this.playTone({
                    frequency: 659.25, // E5
                    type: 'sine',
                    duration: 0.2,
                    attack: 0.02,
                    release: 0.1,
                    volume: 0.5,
                    slide: -100 // 轻微下滑
                });

            // 播放下一关音效 - 上升音

                    frequency: 659.25, // E5

                    duration: 0.2,
                    attack: 0.02,
                    release: 0.1,
                    volume: 0.6,
                    slide: 150 // 轻微上升
                });
            }

            // 播放基本音调
            playTone(options) {
                if (!this.audioContext || this.isMuted || this.volume === 0) return;

                const {
                    frequency = 440,
                    type = 'sine',
                    duration = 0.5,
                    attack = 0.01,
                    release = 0.1,
                    volume = 1,
                    slide = 0
                } = options;

                // 创建音频节点
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                // 连接节点
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                // 设置 oscillator 参数
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);

                // 滑音效果
                if (slide !== 0) {
                    oscillator.frequency.linearRampToValueAtTime(
                        frequency + slide,
                        this.audioContext.currentTime + duration
                    );
                }

                // 设置音量包络
                gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(volume * this.volume, this.audioContext.currentTime + attack);

                if (duration > attack + release) {

                    gainNode.gain.setValueAtTime(volume * this.volume, this.audioContext.currentTime + attack + sustainTime);
                }

                gainNode.gain.linearRampToValueAtTime(0, this.audioContext.currentTime + duration);

                // 开始播放
                oscillator.start();

                // 结束播放
                oscillator.stop(this.audioContext.currentTime + duration);

                // 清理
                oscillator.onended = () => {

                };

        // 计算网格大小
        function calculateGridSize() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const forcedOrientation = gameState.forcedOrientation;
            const effectiveIsPortrait = forcedOrientation
                ? forcedOrientation === 'portrait'
                : windowHeight > windowWidth;
            const header = document.querySelector('.game-header');
            const headerHeight = header ? header.offsetHeight : 50;
            const padding = 20;
            const gap = 10;
            const availableHeight = windowHeight - headerHeight - padding;
            const availableWidth = windowWidth - padding;

            let widthBasedSize, heightBasedSize;

            if (!effectiveIsPortrait) {
                const totalColumns = COLS * 2;
                widthBasedSize = (availableWidth - gap) / totalColumns;
                heightBasedSize = availableHeight / ROWS;
            } else {
                const totalRows = ROWS * 2;
                const titleBarEstimate = 64;
                heightBasedSize = (availableHeight - gap - titleBarEstimate) / totalRows;
                widthBasedSize = availableWidth / COLS;
            }

            let gridSize = Math.floor(Math.min(widthBasedSize, heightBasedSize));
            return Math.max(gridSize, 8);
        }

        // 检查教程状态

            const hasSeenTutorial = localStorage.getItem('tetrisTutorialSeen');
            if (!hasSeenTutorial) {
                setTimeout(() => elements.tutorialMessage.classList.add('show'), 500);
            }
        }

            // 播放开始音效
            soundManager.playNextLevelSound();
        }

        // 更新容器尺寸
        function updateContainerSizes() {
            const gridSize = gameState.gridSize;
            const isPortrait = gameState.isPortrait;

            const piecesTitleHeight = getTitleHeight(elements.piecesGrid);
            const targetTitleHeight = getTitleHeight(elements.targetGrid);

            const gridWidth = COLS * gridSize;
            const gridHeight = ROWS * gridSize;

            const piecesContainer = document.getElementById('pieces-container');
            const piecesHeight = gridHeight + piecesTitleHeight;
            piecesContainer.style.width = `${gridWidth}px`;
            piecesContainer.style.maxWidth = `${gridWidth}px`;
            piecesContainer.style.height = `${piecesHeight}px`;

            const targetHeight = gridHeight + targetTitleHeight;
            elements.targetContainer.style.width = `${gridWidth}px`;
            elements.targetContainer.style.maxWidth = `${gridWidth}px`;
            elements.targetContainer.style.height = `${targetHeight}px`;

            elements.piecesWrapper.style.width = `${gridWidth}px`;
            elements.piecesWrapper.style.maxWidth = `${gridWidth}px`;
            elements.targetWrapper.style.width = `${gridWidth}px`;
            elements.targetWrapper.style.maxWidth = `${gridWidth}px`;

            if (isPortrait) {
                elements.gameMainArea.classList.add('portrait');
                elements.gameMainArea.style.maxWidth = `${gridWidth}px`;
            } else {
                elements.gameMainArea.classList.remove('portrait');
                elements.gameMainArea.style.maxWidth = 'none';
            }
        }

        // 获取标题高度
        function getTitleHeight(gridElement) {
            const container = gridElement.parentElement;
            const title = container.querySelector('div:first-child');
            return title ? title.offsetHeight : 0;
        }

        // 处理全屏变化
        function handleFullscreenChange() {
            gameState.isFullscreen = !!document.fullscreenElement ||
                !!document.webkitFullscreenElement ||
                !!document.mozFullScreenElement ||
                !!document.msFullscreenElement;

            if (gameState.isFullscreen) {
                elements.fullscreenIcon.className = 'fa fa-compress';
                elements.fullscreenBtn.title = '退出全屏';
                document.body.classList.add('fullscreen-active');
            } else {
                elements.fullscreenIcon.className = 'fa fa-expand';
                elements.fullscreenBtn.title = '全屏';
                document.body.classList.remove('fullscreen-active');
            }

            handleResize();
        }

        // 切换全屏
        function toggleFullscreen() {
            soundManager.playPlaceSound();
            if (!gameState.isFullscreen) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(err => console.error(`进入全屏失败: ${err.message}`));
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(err => console.error(`进入全屏失败: ${err.message}`));
                else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen().catch(err => console.error(`进入全屏失败: ${err.message}`));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        // 显示设置面板
        function showSettings() {
            elements.settingsMessage.classList.add('show');
        }

        // 关闭设置面板
        function closeSettings() {
            elements.settingsMessage.classList.remove('show');
        }

        // 切换屏幕方向
        function toggleOrientation() {
            soundManager.playPlaceSound();
            const currentOrientation = gameState.forcedOrientation
                || (window.innerHeight > window.innerWidth ? 'portrait' : 'landscape');

            if (currentOrientation === 'portrait') {
                gameState.forcedOrientation = 'landscape';
                elements.rotateIcon.className = 'fa fa-desktop';
                elements.rotateBtn.title = '切换到竖屏';
            } else {
                gameState.forcedOrientation = 'portrait';
                elements.rotateIcon.className = 'fa fa-mobile';
                elements.rotateBtn.title = '切换到横屏';
            }

            handleResize();
        }

        // 处理窗口大小变化
        function handleResize() {
            const oldSize = gameState.gridSize;
            const oldOrientation = gameState.isPortrait;

            gameState.isPortrait = gameState.forcedOrientation
                ? gameState.forcedOrientation === 'portrait'
                : window.innerHeight > window.innerWidth;
            gameState.gridSize = calculateGridSize();

            if (Math.abs(gameState.gridSize - oldSize) > 0 || gameState.isPortrait !== oldOrientation) {
                const scaleRatio = gameState.gridSize / oldSize || 1;

                clearGrid(elements.piecesGrid);
                clearGrid(elements.targetGrid);

                createGridBackground(elements.piecesGrid);
                createGridBackground(elements.targetGrid);

                updateContainerSizes();

                gameState.pieces.forEach(piece => {
                    piece.col = Math.round(piece.col * scaleRatio);
                    piece.row = Math.round(piece.row * scaleRatio);
                    renderPiece(piece);
                });

                renderTargetShape();
            }
        }

        // 清空网格
        function clearGrid(grid) {
            while (grid.firstChild) grid.removeChild(grid.firstChild);
        }

        // 创建网格背景
        function createGridBackground(container) {
            const gridSize = gameState.gridSize;
            const containerWidth = COLS * gridSize;
            const containerHeight = ROWS * gridSize;

            container.style.gridTemplateColumns = `repeat(${COLS}, ${gridSize}px)`;
            container.style.width = `${containerWidth}px`;
            container.style.height = `${containerHeight}px`;
            container.style.position = 'relative';

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.style.width = `${gridSize}px`;
                    cell.style.height = `${gridSize}px`;
                    cell.style.boxSizing = 'border-box';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    container.appendChild(cell);
                }
            }
        }

        // 创建所有方块
        function createAllPieces() {
            gameState.pieces = [];
            const definitions = gameState.mode === 'classic' ? classicPieceDefinitions : newPieceDefinitions;
            const positions = gameState.mode === 'classic' ? classicInitialPositions : newInitialPositions;
            const ids = Object.keys(definitions).map(Number);

            ids.forEach(id => {
                const piece = createPiece(id, definitions, positions);
                gameState.pieces.push(piece);
                renderPiece(piece);
            });
        }

        // 创建单个方块
        function createPiece(id, definitions, positions) {
            const def = definitions[id];
            const pos = positions[id];

            return {
                id,
                type: def.type,
                color: def.color,
                rotation: def.rotation,
                originalRotation: def.rotation,  // 保存初始旋转状态
                container: def.container,
                row: pos.row,
                col: pos.col,
                originalRow: pos.row,
                originalCol: pos.col,
                originalContainer: def.container,
                element: null
            };
        }

        // 渲染方块
        function renderPiece(piece) {
            if (piece.element) piece.element.remove();

            const gridSize = gameState.gridSize;
            const pieceEl = document.createElement('div');
            pieceEl.className = 'tetris-piece absolute';
            pieceEl.dataset.id = piece.id;
            pieceEl.dataset.type = piece.type;

            if (gameState.hintActive) pieceEl.classList.add('z-30');

            const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
            const shape = shapes[piece.type][piece.rotation];
            pieceEl.style.left = `${piece.col * gridSize}px`;
            pieceEl.style.top = `${piece.row * gridSize}px`;

            shape.forEach(([dr, dc]) => {
                const block = document.createElement('div');
                block.className = `tetris-block bg-${piece.color} absolute`;
                block.style.width = `${gridSize}px`;
                block.style.height = `${gridSize}px`;
                block.style.left = `${dc * gridSize}px`;
                block.style.top = `${dr * gridSize}px`;
                block.style.boxSizing = 'border-box';
                pieceEl.appendChild(block);
            });

            const container = piece.container === 'pieces' ? elements.piecesGrid : elements.targetGrid;
            container.appendChild(pieceEl);
            piece.element = pieceEl;

            addPieceEvents(piece);
            constrainPieceToContainer(piece);
        }

        // 限制方块在容器内
        function constrainPieceToContainer(piece) {
            if (!piece.element) return;

            const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
            const shape = shapes[piece.type][piece.rotation];
            const maxDr = Math.max(...shape.map(([dr, _]) => dr));
            const maxDc = Math.max(...shape.map(([_, dc]) => dc));

            const maxCol = COLS - maxDc - 1;
            const maxRow = ROWS - maxDr - 1;

            piece.col = Math.max(0, Math.min(piece.col, maxCol));
            piece.row = Math.max(0, Math.min(piece.row, maxRow));

            piece.element.style.left = `${piece.col * gameState.gridSize}px`;
            piece.element.style.top = `${piece.row * gameState.gridSize}px`;
        }

        // 为方块添加事件
        function addPieceEvents(piece) {
            const el = piece.element;

            // 触摸事件
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();

                const now = Date.now();
                const timeSinceLastTouch = now - gameState.lastTouchTime;

                if (timeSinceLastTouch < 300 && timeSinceLastTouch > 0) {
                    rotatePiece(piece);
                    gameState.touchCount = 0;
                    if (gameState.touchTimeout) clearTimeout(gameState.touchTimeout);
                } else {
                    const touch = e.touches[0];
                    startDrag(piece, touch);
                    gameState.touchCount++;

                    if (gameState.touchTimeout) clearTimeout(gameState.touchTimeout);
                    gameState.touchTimeout = setTimeout(() => gameState.touchCount = 0, 300);
                }

                gameState.lastTouchTime = now;
            }, { passive: false });

            // 鼠标事件 - 基于时间的双击检测
            el.addEventListener('mousedown', (e) => {
                e.stopPropagation();

                const now = Date.now();
                const timeSinceLastClick = now - gameState.lastTouchTime;

                if (timeSinceLastClick < 300 && timeSinceLastClick > 0) {
                    e.preventDefault();
                    rotatePiece(piece);
                    gameState.touchCount = 0;
                    if (gameState.touchTimeout) clearTimeout(gameState.touchTimeout);
                } else {
                    startDrag(piece, e);
                    gameState.touchCount++;

                    if (gameState.touchTimeout) clearTimeout(gameState.touchTimeout);
                    gameState.touchTimeout = setTimeout(() => gameState.touchCount = 0, 300);
                }

                gameState.lastTouchTime = now;
            });
        }

        // 旋转方块
        function rotatePiece(piece) {
            const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
            const rotationCount = shapes[piece.type].length;
            piece.rotation = (piece.rotation + 1) % rotationCount;

            if (gameState.isDragging && gameState.draggedPiece === piece) {
                const gridSize = gameState.gridSize;
                const shape = shapes[piece.type][piece.rotation];
                const blocks = piece.element.querySelectorAll('.tetris-block');
                blocks.forEach((block, i) => {
                    if (shape[i]) {
                        const [dr, dc] = shape[i];
                        block.style.left = `${dc * gridSize}px`;
                        block.style.top = `${dr * gridSize}px`;
                        block.style.display = '';
                    } else {
                        block.style.display = 'none';
                    }
                });
                if (shape.length > blocks.length) {
                    for (let i = blocks.length; i < shape.length; i++) {
                        const [dr, dc] = shape[i];
                        const block = document.createElement('div');
                        block.className = `tetris-block bg-${piece.color} absolute`;
                        block.style.width = `${gridSize}px`;
                        block.style.height = `${gridSize}px`;
                        block.style.left = `${dc * gridSize}px`;
                        block.style.top = `${dr * gridSize}px`;
                        block.style.boxSizing = 'border-box';
                        piece.element.appendChild(block);
                    }
                }
            } else {
                renderPiece(piece);
                constrainPieceToContainer(piece);
            }

            soundManager.playRotateSound();
        }

        // 开始拖动
        function startDrag(piece, e) {
            gameState.isDragging = true;
            gameState.draggedPiece = piece;

            const rect = piece.element.getBoundingClientRect();
            gameState.dragOffset.x = e.clientX - rect.left;
            gameState.dragOffset.y = e.clientY - rect.top;

            piece.element.classList.add('z-20', 'scale-110', 'shadow-tetris-hover');
            piece.element.style.transition = 'none';

            document.body.appendChild(piece.element);
            piece.element.style.position = 'fixed';
            piece.element.style.left = '0';
            piece.element.style.top = '0';
            piece.element.style.transform = `translate(${rect.left}px, ${rect.top}px)`;
            piece.element.style.willChange = 'transform';

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('mouseleave', stopDrag);

            document.addEventListener('touchmove', touchDragMove, { passive: false });
            document.addEventListener('touchend', touchStopDrag);
            document.addEventListener('touchcancel', touchStopDrag);
        }

        // 触摸拖动
        function touchDragMove(e) {
            e.preventDefault();
            if (e.touches && e.touches.length > 0) dragMove(e.touches[0]);
        }

        // 触摸停止拖动
        function touchStopDrag(e) {
            const touch = e && e.changedTouches && e.changedTouches[0];
            stopDrag(touch);
            document.removeEventListener('touchmove', touchDragMove);
            document.removeEventListener('touchend', touchStopDrag);
            document.removeEventListener('touchcancel', touchStopDrag);
        }

        // 拖动移动
        function dragMove(e) {
            if (!gameState.isDragging || !gameState.draggedPiece) return;

            const piece = gameState.draggedPiece;

            const x = e.clientX - gameState.dragOffset.x;
            const y = e.clientY - gameState.dragOffset.y;

            piece.element.style.transform = `translate(${x}px, ${y}px)`;
        }

        // 停止拖动
        function stopDrag(e) {
            if (!gameState.isDragging || !gameState.draggedPiece) return;

            const piece = gameState.draggedPiece;
            const gridSize = gameState.gridSize;

            piece.element.classList.remove('z-20', 'scale-110', 'shadow-tetris-hover');
            if (gameState.hintActive) piece.element.classList.add('z-30');

            const clientX = e ? e.clientX : (piece.element.offsetLeft + gameState.dragOffset.x);
            const clientY = e ? e.clientY : (piece.element.offsetTop + gameState.dragOffset.y);

            const targetRect = elements.targetGrid.getBoundingClientRect();
            const piecesRect = elements.piecesGrid.getBoundingClientRect();

            const isOverTarget = clientX >= targetRect.left && clientX <= targetRect.right &&
                clientY >= targetRect.top && clientY <= targetRect.bottom;

            const isOverPieces = clientX >= piecesRect.left && clientX <= piecesRect.right &&
                clientY >= piecesRect.top && clientY <= piecesRect.bottom;

            if (isOverTarget) {
                piece.container = 'target';
            } else if (isOverPieces) {
                piece.container = 'pieces';
            }

            const container = piece.container === 'pieces' ? elements.piecesGrid : elements.targetGrid;
            const containerRect = container.getBoundingClientRect();

            const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
            const shape = shapes[piece.type][piece.rotation];
            const maxDc = Math.max(...shape.map(([_, dc]) => dc));
            const maxDr = Math.max(...shape.map(([dr, _]) => dr));

            let col = Math.round((clientX - gameState.dragOffset.x - containerRect.left) / gridSize);
            let row = Math.round((clientY - gameState.dragOffset.y - containerRect.top) / gridSize);

            const maxCol = COLS - maxDc - 1;
            const maxRow = ROWS - maxDr - 1;

            piece.col = Math.max(0, Math.min(col, maxCol));
            piece.row = Math.max(0, Math.min(row, maxRow));

            piece.element.style.transform = 'none';
            piece.element.style.willChange = '';
            piece.element.style.position = 'absolute';
            container.appendChild(piece.element);
            piece.element.style.left = `${piece.col * gridSize}px`;
            piece.element.style.top = `${piece.row * gridSize}px`;

            requestAnimationFrame(() => {
                piece.element.style.transition = '';
            });

            soundManager.playPlaceSound();

            checkLevelCompletion();

            if (gameState.hintActive && gameState.hintedPieces.some(hp => hp.id === piece.id)) {
                const remainingHints = gameState.hintedPieces.filter(hp =>
                    !gameState.pieces.some(p => p.id === hp.id && p.container === 'target')
                );

                if (remainingHints.length === 0) {
                    clearHint();
                } else {
                    updateHintForRemainingPieces(remainingHints);
                }
            }

            gameState.isDragging = false;
            gameState.draggedPiece = null;

            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('mouseleave', stopDrag);
        }

        // 计算方块数量
        function calculatePieceCount() {
            let [minPieces, maxPieces] = [2, 4];
            switch (gameState.difficulty) {
                case 'medium': [minPieces, maxPieces] = [5, 8]; break;
                case 'hard': [minPieces, maxPieces] = [9, gameState.mode === 'classic' ? 14 : 16]; break;
            }

            const totalLevels = DIFFICULTY_LEVELS[gameState.difficulty];
            const progress = (gameState.level - 1) / (totalLevels - 1);
            const pieceCount = Math.round(minPieces + progress * (maxPieces - minPieces));

            return Math.max(minPieces, Math.min(pieceCount, maxPieces));
        }

        // 生成关卡
        function generateLevel() {
            clearTargetArea();

            gameState.pieceCount = calculatePieceCount();
            elements.piecesCountDisplay.textContent = gameState.pieceCount;

            const totalPieces = gameState.mode === 'classic' ? 14 : 16;
            const allPieceIds = Array.from({ length: totalPieces }, (_, i) => i + 1);
            gameState.usedPieceIds = [];

            while (gameState.usedPieceIds.length < gameState.pieceCount) {
                const randomId = allPieceIds[Math.floor(Math.random() * allPieceIds.length)];
                if (!gameState.usedPieceIds.includes(randomId)) {
                    gameState.usedPieceIds.push(randomId);
                }
            }

            generateTargetShape();
        }

        // 清空目标区域
        function clearTargetArea() {
            gameState.pieces.forEach(piece => {
                piece.row = piece.originalRow;
                piece.col = piece.originalCol;
                piece.container = piece.originalContainer;
                piece.rotation = piece.originalRotation;  // 重置旋转状态
                renderPiece(piece);
            });

            gameState.targetShape = [];
            gameState.targetShapeColors.clear();
            document.querySelectorAll('#target-grid .target-block').forEach(block => block.remove());
            elements.successMessage.classList.add('opacity-0', 'pointer-events-none');
            clearHint();
        }

        // 检查相邻
        function areAdjacent(r1, c1, r2, c2) {
            return (Math.abs(r1 - r2) === 1 && c1 === c2) || (Math.abs(c1 - c2) === 1 && r1 === r2);
        }

        // 获取相邻空位置
        function getAdjacentEmptyPositions(targetBlocks, rows, cols) {
            const adjacentPositions = new Set();

            targetBlocks.forEach(block => {
                const [r, c] = block.split(',').map(Number);
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

                directions.forEach(([dr, dc]) => {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        const pos = `${nr},${nc}`;
                        if (!targetBlocks.has(pos)) adjacentPositions.add(pos);
                    }
                });
            });

            return Array.from(adjacentPositions);
        }

        // 检查形状相邻
        function checkShapeAdjacency(shape, baseRow, baseCol, targetBlocks) {
            for (const [sr, sc] of shape) {
                const r = baseRow + sr;
                const c = baseCol + sc;
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

                for (const [dr, dc] of directions) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (targetBlocks.has(`${nr},${nc}`)) return true;
                }
            }
            return false;
        }

        // 检查连通性
        function isFullyConnected(targetBlocks) {
            if (targetBlocks.size <= 1) return true;

            const blocksArray = Array.from(targetBlocks);
            const startBlock = blocksArray[0];
            const visited = new Set();
            const queue = [startBlock];

            visited.add(startBlock);

            while (queue.length > 0) {
                const current = queue.shift();
                const [r, c] = current.split(',').map(Number);
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

                directions.forEach(([dr, dc]) => {
                    const nr = r + dr;
                    const nc = c + dc;
                    const neighbor = `${nr},${nc}`;

                    if (targetBlocks.has(neighbor) && !visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push(neighbor);
                    }
                });
            }

            return visited.size === targetBlocks.size;
        }

        // 生成目标形状
        function generateTargetShape() {
            const targetBlocks = new Set();
            const usedPieces = gameState.pieces.filter(p => gameState.usedPieceIds.includes(p.id));
            gameState.targetShapeColors.clear();

            let placed = false;
            let attempts = 0;
            const maxAttempts = 300;

            const minCol = 1;
            const maxCol = COLS - 2;
            const minRow = 1;
            const maxRow = ROWS - 2;

            while (!placed && attempts < maxAttempts) {
                attempts++;
                targetBlocks.clear();
                gameState.targetShapeColors.clear();

                const firstPiece = usedPieces[0];
                const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
                const rotationCount = shapes[firstPiece.type].length;
                const firstRotation = Math.floor(Math.random() * rotationCount);
                const startRow = Math.floor(Math.random() * (maxRow - minRow + 1)) + minRow;
                const startCol = Math.floor(Math.random() * (maxCol - minCol + 1)) + minCol;

                const shape = shapes[firstPiece.type][firstRotation];
                let firstPieceValid = true;

                shape.forEach(([dr, dc]) => {
                    const r = startRow + dr;
                    const c = startCol + dc;
                    if (r < minRow || r > maxRow || c < minCol || c > maxCol) firstPieceValid = false;
                    targetBlocks.add(`${r},${c}`);
                    gameState.targetShapeColors.set(`${r},${c}`, firstPiece.color);
                });

                if (!firstPieceValid) continue;

                let allPlaced = true;
                for (let i = 1; i < usedPieces.length; i++) {
                    const piece = usedPieces[i];
                    const rotation = Math.floor(Math.random() * shapes[piece.type].length);
                    const shape = shapes[piece.type][rotation];
                    let placedPiece = false;

                    const adjacentPositions = getAdjacentEmptyPositions(targetBlocks, ROWS, COLS);

                    for (let attempt = 0; attempt < 100; attempt++) {
                        let baseRow, baseCol;

                        if (adjacentPositions.length > 0 && attempt < 70) {
                            const pos = adjacentPositions[Math.floor(Math.random() * adjacentPositions.length)];
                            [baseRow, baseCol] = pos.split(',').map(Number);
                        } else {
                            baseRow = Math.floor(Math.random() * (maxRow - minRow + 1)) + minRow;
                            baseCol = Math.floor(Math.random() * (maxCol - minCol + 1)) + minCol;
                        }

                        let canPlace = true;
                        const newBlocks = [];

                        shape.forEach(([sr, sc]) => {
                            const r = baseRow + sr;
                            const c = baseCol + sc;
                            if (r < minRow || r > maxRow || c < minCol || c > maxCol) canPlace = false;
                            if (targetBlocks.has(`${r},${c}`)) canPlace = false;
                            newBlocks.push(`${r},${c}`);
                        });

                        if (canPlace) canPlace = checkShapeAdjacency(shape, baseRow, baseCol, targetBlocks);

                        if (canPlace) {
                            newBlocks.forEach(block => {
                                targetBlocks.add(block);
                                gameState.targetShapeColors.set(block, piece.color);
                            });
                            placedPiece = true;
                            break;
                        }
                    }

                    if (!placedPiece) {
                        allPlaced = false;
                        break;
                    }
                }

                if (allPlaced) allPlaced = isFullyConnected(targetBlocks);

                if (allPlaced) placed = true;
            }

            if (!placed) {
                console.log(`警告: 尝试${maxAttempts}次后仍无法生成完全连通的图形，使用当前结果`);
                if (targetBlocks.size === 0 && usedPieces.length > 0) {
                    const firstPiece = usedPieces[0];
                    const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
                    const shape = shapes[firstPiece.type][0];
                    shape.forEach(([dr, dc]) => {
                        const r = minRow + dr;
                        const c = minCol + dc;
                        targetBlocks.add(`${r},${c}`);
                        gameState.targetShapeColors.set(`${r},${c}`, firstPiece.color);
                    });
                }
            }

            gameState.targetShape = Array.from(targetBlocks).map(block => {
                const [r, c] = block.split(',').map(Number);
                return { row: r, col: c };
            });

            renderTargetShape();
        }

        // 渲染目标形状
        function renderTargetShape() {
            document.querySelectorAll('#target-grid .target-block').forEach(block => block.remove());

            const gridSize = gameState.gridSize;
            const targetGridStyle = window.getComputedStyle(elements.targetGrid);
            const targetPaddingTop = parseFloat(targetGridStyle.paddingTop);
            const targetPaddingLeft = parseFloat(targetGridStyle.paddingLeft);

            gameState.targetShape.forEach(({ row, col }) => {
                const blockId = `${row},${col}`;
                const block = document.createElement('div');
                let classes = 'tetris-block absolute target-block';

                if (gameState.hintActive) {
                    const color = gameState.targetShapeColors.get(blockId);
                    classes += ` bg-${color} opacity-95 hint target-hint-pulse hint-active`;
                } else {
                    classes += ' bg-game-target opacity-70';
                }

                block.className = classes;
                block.style.width = `${gridSize}px`;
                block.style.height = `${gridSize}px`;
                block.style.left = `${col * gridSize + targetPaddingLeft}px`;
                block.style.top = `${row * gridSize + targetPaddingTop}px`;
                block.style.boxSizing = 'border-box';
                elements.targetGrid.appendChild(block);
            });
        }

        // 检查关卡完成
        function checkLevelCompletion() {
            const placedBlocks = new Set();

            gameState.pieces.forEach(piece => {
                if (piece.container === 'target') {
                    const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
                    const shape = shapes[piece.type][piece.rotation];
                    shape.forEach(([dr, dc]) => {
                        const r = piece.row + dr;
                        const c = piece.col + dc;
                        placedBlocks.add(`${r},${c}`);
                    });
                }
            });

            const targetBlocks = new Set(gameState.targetShape.map(({ row, col }) => `${row},${col}`));

            if (placedBlocks.size === targetBlocks.size) {
                let isComplete = true;
                placedBlocks.forEach(block => {
                    if (!targetBlocks.has(block)) isComplete = false;
                });

                if (isComplete) completeLevel();
            }
        }

        // 完成关卡
        function completeLevel() {
            elements.successMessage.classList.remove('opacity-0', 'pointer-events-none');
            handleLevelProgression();
            saveGameProgress();
            // 播放成功音效
            soundManager.playSuccessSound();
        }

        // 处理关卡进度
        function handleLevelProgression() {
            const currentDifficulty = gameState.difficulty;
            const currentLevel = gameState.level;
            const totalLevels = DIFFICULTY_LEVELS[currentDifficulty];

            if (currentLevel >= totalLevels) {
                switch (currentDifficulty) {
                    case 'easy':
                        gameState.difficulty = 'medium';
                        gameState.level = 1;
                        elements.difficultySelect.value = 'medium';
                        break;
                    case 'medium':
                        gameState.difficulty = 'hard';
                        gameState.level = 1;
                        elements.difficultySelect.value = 'hard';
                        break;
                    case 'hard':
                        gameState.level = totalLevels;
                        elements.successMessage.querySelector('p').textContent = '恭喜您已完成所有难度！将继续挑战困难难度最后一关。';
                        break;
                }
            } else {
                gameState.level++;
            }

            gameState.totalLevels = DIFFICULTY_LEVELS[gameState.difficulty];
            elements.levelDisplay.textContent = gameState.level;
            elements.totalLevelsDisplay.textContent = gameState.totalLevels;
        }

        // 重置方块
        function resetPieces() {
            gameState.pieces.forEach(piece => {
                piece.row = piece.originalRow;
                piece.col = piece.originalCol;
                piece.container = piece.originalContainer;
                piece.rotation = piece.originalRotation;  // 重置旋转状态
                renderPiece(piece);
            });

            clearHint();
            // 播放重置音效
            soundManager.playResetSound();
        }

        // 清除提示
        function clearHint() {
            if (gameState.hintActive) {
                gameState.hintActive = false;
                gameState.hintedPieces = [];

                document.querySelectorAll('.tetris-piece').forEach(el => {
                    el.classList.remove('shadow-hint', 'pulse-animation', 'scale-110', 'z-30', 'opacity-70');
                    el.querySelectorAll('.tetris-block').forEach(block => block.style.opacity = '1');
                });

                renderTargetShape();

                if (gameState.hintTimer) {
                    clearTimeout(gameState.hintTimer);
                    gameState.hintTimer = null;
                }
            }
        }

        // 更新剩余提示
        function updateHintForRemainingPieces(remainingPieces) {
            document.querySelectorAll('.tetris-piece').forEach(el => {
                el.classList.remove('shadow-hint', 'pulse-animation', 'scale-110');
            });

            gameState.hintedPieces = remainingPieces;

            remainingPieces.forEach(piece => {
                const pieceEl = document.querySelector(`.tetris-piece[data-id="${piece.id}"]`);
                if (pieceEl) pieceEl.classList.add('shadow-hint', 'pulse-animation', 'scale-110');
            });
        }

        // 显示提示
        function showHint() {
            clearHint();

            gameState.hintActive = true;
            gameState.hintedPieces = [];

            const placedPieces = gameState.pieces.filter(p => p.container === 'target');
            const placedBlocks = new Set();

            placedPieces.forEach(piece => {
                const shapes = gameState.mode === 'classic' ? classicShapes : newShapes;
                const shape = shapes[piece.type][piece.rotation];
                shape.forEach(([dr, dc]) => {
                    const r = piece.row + dr;
                    const c = piece.col + dc;
                    placedBlocks.add(`${r},${c}`);
                });
            });

            const unusedPieces = gameState.pieces.filter(p =>
                gameState.usedPieceIds.includes(p.id) && p.container !== 'target'
            );

            if (unusedPieces.length === 0) return;

            gameState.hintedPieces = unusedPieces;

            unusedPieces.forEach(piece => {
                const pieceEl = document.querySelector(`.tetris-piece[data-id="${piece.id}"]`);
                if (pieceEl) pieceEl.classList.add('shadow-hint', 'pulse-animation', 'scale-110');
            });

            gameState.pieces.forEach(piece => renderPiece(piece));
            renderTargetShape();

            // 播放提示音效
            soundManager.playHintSound();

            gameState.hintTimer = setTimeout(clearHint, 2500);
        }

        // 下一关
        function nextLevel() {
            elements.successMessage.classList.add('opacity-0', 'pointer-events-none');
            handleLevelProgression();
            generateLevel();
            saveGameProgress();
            // 播放下一关音效
            soundManager.playNextLevelSound();
        }

        // 切换游戏模式
        function switchGameMode(mode) {
            gameState.mode = mode;

            clearGrid(elements.piecesGrid);
            clearGrid(elements.targetGrid);

            createGridBackground(elements.piecesGrid);
            createGridBackground(elements.targetGrid);

            loadGameProgress();
            createAllPieces();
            generateLevel();
            // 播放模式切换音效
            soundManager.playNextLevelSound();
        }

        // 保存游戏进度
        function saveGameProgress() {
            const progressKey = `tetrisPuzzleProgress-${gameState.mode}`;
            const progress = {
                difficulty: gameState.difficulty,
                level: gameState.level
            };
            localStorage.setItem(progressKey, JSON.stringify(progress));
        }

        // 加载游戏进度
        function loadGameProgress() {
            const progressKey = `tetrisPuzzleProgress-${gameState.mode}`;
            const savedProgress = localStorage.getItem(progressKey);

            if (savedProgress) {
                const progress = JSON.parse(savedProgress);
                gameState.difficulty = progress.difficulty || 'easy';
                gameState.level = progress.level || 1;
                elements.difficultySelect.value = gameState.difficulty;
                elements.levelDisplay.textContent = gameState.level;
            } else {
                gameState.difficulty = 'easy';
                gameState.level = 1;
                elements.difficultySelect.value = 'easy';
                elements.levelDisplay.textContent = '1';
            }

            gameState.totalLevels = DIFFICULTY_LEVELS[gameState.difficulty];
            elements.totalLevelsDisplay.textContent = gameState.totalLevels;
        }

        // 添加事件监听
        function addEventListeners() {
            elements.tutorialCloseBtn.addEventListener('click', closeTutorial);
            elements.gameModeSelect.addEventListener('change', () => switchGameMode(elements.gameModeSelect.value));
            elements.difficultySelect.addEventListener('change', () => {
                gameState.difficulty = elements.difficultySelect.value;
                gameState.totalLevels = DIFFICULTY_LEVELS[gameState.difficulty];
                elements.totalLevelsDisplay.textContent = gameState.totalLevels;
                gameState.level = 1;
                elements.levelDisplay.textContent = gameState.level;
                generateLevel();
                saveGameProgress();
                // 播放难度切换音效
                soundManager.playNextLevelSound();
            });

            elements.resetBtn.addEventListener('click', resetPieces);
            elements.hintBtn.addEventListener('click', showHint);
            elements.fullscreenBtn.addEventListener('click', toggleFullscreen);
            elements.nextBtn.addEventListener('click', nextLevel);
            elements.successNextBtn.addEventListener('click', nextLevel);
            elements.settingsBtn.addEventListener('click', showSettings);
            elements.settingsCloseBtn.addEventListener('click', closeSettings);
            elements.settingsMessage.addEventListener('click', (e) => {
                if (e.target === elements.settingsMessage) {
                    closeSettings();
                }
            });
            elements.showTutorialBtn.addEventListener('click', () => {
                closeSettings();
                showTutorial();
            });
            elements.rotateBtn.addEventListener('click', toggleOrientation);

            elements.targetGrid.addEventListener('click', () => {
                if (gameState.isDragging) stopDrag();
            });

            elements.tutorialMessage.addEventListener('click', (e) => {
                if (e.target === elements.tutorialMessage) {
                    closeTutorial();
                }
            });

            document.addEventListener('dragstart', (e) => e.preventDefault());
            document.addEventListener('touchmove', (e) => {
                if (gameState.isDragging) e.preventDefault();
            }, { passive: false });
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
